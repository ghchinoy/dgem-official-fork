<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="egm-tonal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6ef3" />
      <stop offset="55%" stop-color="#7cacf8" />
      <stop offset="100%" stop-color="#ff8d41" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="40" fill="#15171b" stroke="#2b3037" stroke-width="2" />

  <!-- Outer Denoising Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#2b3037" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Canvas Tiles (GM3 Elephant Blue & Goldfish Orange Tonal Duo) -->
  <g filter="url(#soft-glow)">
    <rect x="130" y="130" width="60" height="60" rx="14" fill="#1b6ef3" opacity="0.95" />
    <rect x="210" y="130" width="60" height="60" rx="14" fill="#7cacf8" opacity="0.9" />
    <rect x="130" y="210" width="60" height="60" rx="14" fill="#0b57d0" opacity="0.9" />
    <rect x="210" y="210" width="60" height="60" rx="14" fill="#ff8d41" opacity="0.95" />
  </g>

  <!-- Inner Core -->
  <circle cx="200" cy="200" r="32" fill="url(#egm-tonal-grad)" />
  <circle cx="200" cy="200" r="12" fill="#0f1013" />
</svg>
